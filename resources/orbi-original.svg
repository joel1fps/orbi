<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Soft subtle ambient shadow beneath Orbi -->
  <ellipse cx="60" cy="110" rx="34" ry="6" fill="#101513" opacity="0.4" />
  
  <!-- Back Orbital Ring -->
  <path d="M16 66 C 14 54, 106 46, 104 58" stroke="#3ea591" stroke-width="5" stroke-linecap="round" opacity="0.75" />
  <circle cx="20" cy="63" r="3" fill="#a3e635" />
  <circle cx="98" cy="51" r="2.5" fill="#5eead4" />

  <!-- Feet -->
  <ellipse cx="44" cy="98" rx="10" ry="7" fill="#31423c" />
  <ellipse cx="76" cy="98" rx="10" ry="7" fill="#31423c" />
  <ellipse cx="44" cy="97" rx="8" ry="5" fill="#445c54" />
  <ellipse cx="76" cy="97" rx="8" ry="5" fill="#445c54" />

  <!-- Main Body (Cute round creature) -->
  <path d="M 60 28 C 34 28, 26 48, 26 74 C 26 94, 38 102, 60 102 C 82 102, 94 94, 94 74 C 94 48, 86 28, 60 28 Z" fill="#3d564e" />
  <path d="M 60 30 C 37 30, 29 49, 29 73 C 29 92, 40 100, 60 100 C 80 100, 91 92, 91 73 C 91 49, 83 30, 60 30 Z" fill="#4fb7a2" />
  
  <!-- Belly / Chest Patch -->
  <ellipse cx="60" cy="78" rx="20" ry="16" fill="#7ed5c3" />
  
  <!-- Antennae / Ears with cosmic tips -->
  <path d="M42 32 C 38 20, 32 15, 27 16" stroke="#3d564e" stroke-width="4" stroke-linecap="round" />
  <circle cx="26" cy="16" r="6" fill="#a3e635" />
  <circle cx="26" cy="16" r="3" fill="#ffffff" opacity="0.8" />

  <path d="M78 32 C 82 20, 88 15, 93 16" stroke="#3d564e" stroke-width="4" stroke-linecap="round" />
  <circle cx="94" cy="16" r="6" fill="#5eead4" />
  <circle cx="94" cy="16" r="3" fill="#ffffff" opacity="0.8" />

  <!-- Paws (Friendly arms) -->
  <!-- Left hand resting -->
  <path d="M 28 68 C 22 72, 20 80, 26 84 C 30 87, 35 84, 34 76 Z" fill="#3d564e" />
  <!-- Right waving hand -->
  <path d="M 90 64 C 98 58, 106 52, 107 45 C 108 40, 100 38, 93 46 C 89 51, 88 58, 88 64 Z" fill="#445c54" />
  <circle cx="104" cy="44" r="5" fill="#4fb7a2" />

  <!-- Face: Cheeks -->
  <ellipse cx="41" cy="67" rx="5" ry="3.5" fill="#f472b6" opacity="0.6" />
  <ellipse cx="79" cy="67" rx="5" ry="3.5" fill="#f472b6" opacity="0.6" />

  <!-- Face: Big expressive kawaii eyes -->
  <!-- Left Eye -->
  <ellipse cx="47" cy="58" rx="6.5" ry="8" fill="#171d1b" />
  <circle cx="45.5" cy="55.5" r="2.8" fill="#ffffff" />
  <circle cx="49" cy="61" r="1.3" fill="#ffffff" opacity="0.8" />

  <!-- Right Eye -->
  <ellipse cx="73" cy="58" rx="6.5" ry="8" fill="#171d1b" />
  <circle cx="71.5" cy="55.5" r="2.8" fill="#ffffff" />
  <circle cx="75" cy="61" r="1.3" fill="#ffffff" opacity="0.8" />

  <!-- Cute Mouth -->
  <path d="M 56 65 Q 60 69, 64 65" stroke="#171d1b" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Front Orbital Ring (Loops in front of belly) -->
  <path d="M 16 66 C 20 82, 100 76, 104 58" stroke="#4fb7a2" stroke-width="5" stroke-linecap="round" />
  <path d="M 26 71 C 36 80, 84 78, 94 65" stroke="#7ed5c3" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  
  <!-- Tiny orbital satellite orbiting Orbi -->
  <circle cx="86" cy="74" r="4.5" fill="#facc15" />
  <circle cx="86" cy="74" r="2.2" fill="#ffffff" />
  <!-- Sparkles -->
  <path d="M 33 46 Q 35 48 37 46 Q 35 44 33 46 Z" fill="#ffffff" opacity="0.7" />
</svg>
